# License-free CloakHub image. No license key, no browser download at runtime,
# and no license-capacity query: the license-free browser is baked into the image.
# The image already defaults CLOAKHUB_DATA_DIR=/data, CLOAKHUB_HOST=0.0.0.0,
# CLOAKHUB_PORT=7788, CLOAKHUB_LICENSE_MODE=none, CLOAKHUB_MAX_RUNNING_INSTANCES=10,
# and the browser path, so this file only sets what an operator typically customizes.
services:
  cloakhub-free:
    image: ghcr.io/txchen/cloakhub_free:0.8.0
    restart: unless-stopped
    shm_size: 2gb
    environment:
      CLOAKHUB_DISK_CACHE_SIZE_MB: "${CLOAKHUB_DISK_CACHE_SIZE_MB:-256}"
      CLOAKHUB_DEFAULT_TIMEZONE: "${CLOAKHUB_DEFAULT_TIMEZONE:-UTC}"
      CLOAKHUB_DEFAULT_LOCALE: "${CLOAKHUB_DEFAULT_LOCALE:-en-US}"
      CLOAKHUB_AUTH_TOKEN: "${CLOAKHUB_AUTH_TOKEN:?Set CLOAKHUB_AUTH_TOKEN in .env}"
      # Uncomment to raise the browser-instance cap (image default is 10):
      # CLOAKHUB_MAX_RUNNING_INSTANCES: "20"
    ports:
      - "${CLOAKHUB_BIND_ADDRESS:-127.0.0.1}:7788:7788"
    volumes:
      - ./data:/data
