name: Free arm64 Image

# Manually build the license-free arm64 image for a released source tag.
# The source tree comes from `source_ref`; the Dockerfile comes from this
# commit (Dockerfile.free.arm64), which bakes the arm64 no-license browser
# asset from the cloakbrowser-154.0.8037.57.1-patched release.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source git tag to build
        default: v0.8.2
        required: true
      image_tag:
        description: Image tag to publish
        default: 0.8.2-arm64
        required: true

permissions:
  contents: read
  packages: write

jobs:
  free-arm64:
    name: Build and publish free arm64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out Dockerfile
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Check out source tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: src

      - name: Use arm64 Dockerfile
        run: cp tooling/Dockerfile.free.arm64 src/Dockerfile.free.arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.free.arm64
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}_free:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_ref }}
