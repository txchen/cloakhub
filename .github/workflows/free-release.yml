name: Free multi-arch release

# Versioned free-image publication only. Does not move latest or the 0.9 alias.
on:
  push:
    branches: [release/0.9.2]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: free-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.free
            chrome_sha: ef78214b823c9a51b0e05d5761025478ad5206c40d0153a8926a2a4a4e0911be
          - arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.free.arm64
            chrome_sha: 54f0547c5223a963d15dba6999403c22ea8f1042667433af387a88c095886364
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/${{ github.repository }}_free:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.9.2
          cache-from: type=gha,scope=free-156-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=free-156-${{ matrix.arch }}
      - name: Verify browser hash, offline concurrency and Hub health
        env:
          IMAGE: ghcr.io/${{ github.repository }}_free:sha-${{ github.sha }}-${{ matrix.arch }}
          EXPECTED: ${{ matrix.chrome_sha }}
        run: bash scripts/smoke-free-image.sh "$IMAGE" "$EXPECTED"
      - name: Push tested image and record digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}_free:sha-${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p digests
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: free-digest-${{ matrix.arch }}
          path: digests/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: free-digest-*
          merge-multiple: true
          path: digests
      - name: Publish versioned multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}_free
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          test "$VERSION" = 0.9.2
          AMD64=$(cat digests/amd64)
          ARM64=$(cat digests/arm64)
          docker buildx imagetools create -t "$IMAGE:$VERSION-amd64" "$AMD64"
          docker buildx imagetools create -t "$IMAGE:$VERSION-arm64" "$ARM64"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$AMD64" "$ARM64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > manifest.json
          node -e 'const m=require("./manifest.json"); const a=m.manifests.filter(x=>x.platform.os==="linux").map(x=>x.platform.architecture).sort(); if(JSON.stringify(a)!==JSON.stringify(["amd64","arm64"])) throw Error(JSON.stringify(a));'
      - uses: actions/upload-artifact@v4
        with:
          name: free-release-manifest
          path: manifest.json
