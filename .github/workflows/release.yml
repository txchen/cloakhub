name: Release

# Versioned multi-arch release of ghcr.io/<owner>/cloakhub from a v<version> tag.
# Each architecture is built on a native runner, smoke-tested, then merged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME must be v$VERSION"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: go vet ./...
      - run: go test -race ./...
      - run: bun test
      - run: bunx tsc --noEmit

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            chrome_sha: ef78214b823c9a51b0e05d5761025478ad5206c40d0153a8926a2a4a4e0911be
          - arch: arm64
            runner: ubuntu-24.04-arm
            chrome_sha: 54f0547c5223a963d15dba6999403c22ea8f1042667433af387a88c095886364
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read version
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Build native image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify browser hash, offline concurrency, viewer runtime and Hub health
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          EXPECTED: ${{ matrix.chrome_sha }}
        run: bash scripts/smoke-image.sh "$IMAGE" "$EXPECTED"
      - name: Push tested image and record digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE"
          mkdir -p digests
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Publish versioned multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          MINOR=${VERSION%.*}
          AMD64=$(cat digests/amd64)
          ARM64=$(cat digests/arm64)
          docker buildx imagetools create -t "$IMAGE:$VERSION-amd64" "$AMD64"
          docker buildx imagetools create -t "$IMAGE:$VERSION-arm64" "$ARM64"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" "$AMD64" "$ARM64"
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > manifest.json
          node -e 'const m=require("./manifest.json"); const a=m.manifests.filter(x=>x.platform.os==="linux").map(x=>x.platform.architecture).sort(); if(JSON.stringify(a)!==JSON.stringify(["amd64","arm64"])) throw Error(JSON.stringify(a));'
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: manifest.json
