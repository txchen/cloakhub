<!doctype html><meta charset="utf-8"><title>Inventory review</title><h1>Inventory review</h1><p>Review all pages. Qualifying items: stock greater than zero and price at most 50. Sum stock, not price.</p><div id="grid"></div><button id="prev">Previous</button><button id="next">Next</button><p id="pagination"></p><h2>Submit review</h2><label>Reference <input id="ref"></label><label>Total qualifying stock <input id="total" type="number"></label><label><input id="confirm" type="checkbox">I reviewed all pages</label><button id="save">Save review</button><p role="status" id="status"></p><script>
const rows=ROWS;let page=0; function render(){let r=rows.slice(page*4,page*4+4);document.querySelector('#grid').innerHTML='<table><tr><th>Item</th><th>Price</th><th>Stock</th></tr>'+r.map(x=>`<tr><td>${x.name}</td><td>${x.price}</td><td>${x.stock}</td></tr>`).join('')+'</table>';document.querySelector('#pagination').textContent=`Page ${page+1} of 3`;prev.disabled=page===0;next.disabled=page===2;} prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};save.onclick=async()=>{if(!document.querySelector("#confirm").checked){status.textContent='Confirm review first';return}save.disabled=true;await new Promise(r=>setTimeout(r,700));let res=await fetch(location.pathname,{method:'POST',body:JSON.stringify({reference:ref.value,total:Number(total.value),confirmed:document.querySelector("#confirm").checked})});document.querySelector('#status').textContent=res.ok?'Review saved':'Save failed'};render();</script>
