<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Optional font experiment. Mount authorized, real font files at this path.
     Directory presence alone does not establish a complete Windows font set. -->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <dir>/opt/evaluation/windows-fonts/files</dir>
</fontconfig>
