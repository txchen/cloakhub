<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Preserve system rendering rules but restrict visible font directories.
     An isolation control, NOT a certified Windows rendering configuration. -->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <reset-dirs/>
  <dir>/opt/evaluation/windows-fonts/files</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Courier New</family></prefer></alias>
</fontconfig>
